<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>AVB Closeout Importer</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f0f2f5;
            min-height: 100vh;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding: 40px 16px;
        }
        .card {
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 2px 12px rgba(0,0,0,.10);
            padding: 36px 40px;
            width: 100%;
            max-width: 620px;
        }
        h1 { font-size: 1.45rem; color: #1a1a2e; margin-bottom: 6px; }
        .subtitle { color: #6b7280; font-size: .9rem; margin-bottom: 28px; }
        .drop-zone {
            border: 2px dashed #cbd5e1;
            border-radius: 8px;
            padding: 32px 20px;
            text-align: center;
            cursor: pointer;
            background: #f8fafc;
            margin-bottom: 18px;
        }
        .drop-zone p { color: #475569; font-size: .93rem; }
        .drop-zone span { color: #3b82f6; font-weight: 600; }
        #file-name { margin-top: 8px; font-size: .85rem; color: #374151; font-weight: 500; }
        input[type="file"] { display: none; }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #2563eb;
            color: #fff;
            border: none;
            border-radius: 7px;
            padding: 11px 26px;
            font-size: .95rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            justify-content: center;
        }
        .btn:hover { background: #1d4ed8; }
        .btn:disabled { background: #93c5fd; cursor: not-allowed; }
        .result { margin-top: 24px; border-radius: 8px; padding: 18px 20px; font-size: .92rem; }
        .result.success { background: #f0fdf4; border: 1px solid #86efac; }
        .result.partial  { background: #fffbeb; border: 1px solid #fcd34d; }
        .result.error    { background: #fff1f2; border: 1px solid #fca5a5; }
        .result-title { font-weight: 700; font-size: 1rem; margin-bottom: 8px; }
        .result.success .result-title { color: #15803d; }
        .result.partial .result-title { color: #92400e; }
        .result.error   .result-title { color: #b91c1c; }
        ul { margin-left: 18px; margin-top: 6px; line-height: 1.7; color: #374151; }
    </style>
</head>
<body>
<div class="card">
    <h1>AVB Closeout Importer</h1>
    <p class="subtitle">Upload an Excel (.xlsx) file to import closeout records.</p>

    <form method="post" th:action="@{/import}" enctype="multipart/form-data" id="uploadForm">
        <div class="drop-zone" id="dropZone"
             onclick="document.getElementById('fileInput').click()">
            <svg width="40" height="40" fill="none" viewBox="0 0 24 24"
                 stroke="currentColor" stroke-width="1.5"
                 style="display:block;margin:0 auto 10px;color:#94a3b8">
                <path stroke-linecap="round" stroke-linejoin="round"
                      d="M12 16V4m0 0l-4 4m4-4l4 4M4 16v2a2 2 0 002 2h12a2 2 0 002-2v-2"/>
            </svg>
            <p><span>Click to browse</span> or drag &amp; drop here</p>
            <p style="color:#9ca3af;font-size:.8rem;margin-top:4px;">.xlsx files only</p>
            <p id="file-name"></p>
        </div>
        <input type="file" id="fileInput" name="file" accept=".xlsx"/>
        <button type="submit" class="btn" id="importBtn" disabled>Import</button>
    </form>

    <div th:if="${result}"
         th:class="'result ' + ${result.status.name().toLowerCase()}"
         id="resultPanel">

        <div th:if="${result.status.name() == 'SUCCESS'}">
            <div class="result-title">✅ Import Successful</div>
            <p><strong th:text="${result.importedCount}">0</strong> record(s) imported.</p>
        </div>

        <div th:if="${result.status.name() == 'PARTIAL'}">
            <div class="result-title">⚠️ Import Completed with Issues</div>
            <p><strong th:text="${result.importedCount}">0</strong> record(s) imported.</p>
            <div th:if="${result.hasWarnings()}">
                <p style="margin-top:10px;font-weight:600;">Warnings</p>
                <ul>
                    <li th:each="w : ${result.warnings}" th:text="${w}"></li>
                </ul>
            </div>
            <div th:if="${result.hasErrors()}">
                <p style="margin-top:10px;font-weight:600;color:#b91c1c;">Errors</p>
                <ul>
                    <li th:each="e : ${result.errors}" th:text="${e}"
                        style="color:#b91c1c;"></li>
                </ul>
            </div>
        </div>

        <div th:if="${result.status.name() == 'ERROR'}">
            <div class="result-title">❌ Import Failed</div>
            <ul>
                <li th:each="e : ${result.errors}" th:text="${e}"></li>
            </ul>
        </div>
    </div>
</div>

<script>
    const fileInput  = document.getElementById('fileInput');
    const importBtn  = document.getElementById('importBtn');
    const fileNameEl = document.getElementById('file-name');
    const dropZone   = document.getElementById('dropZone');

    fileInput.addEventListener('change', () => {
        if (fileInput.files.length > 0) {
            fileNameEl.textContent = '📄 ' + fileInput.files[0].name;
            importBtn.disabled = false;
        }
    });

    dropZone.addEventListener('dragover', e => {
        e.preventDefault();
        dropZone.style.borderColor = '#3b82f6';
    });
    dropZone.addEventListener('dragleave', () => {
        dropZone.style.borderColor = '#cbd5e1';
    });
    dropZone.addEventListener('drop', e => {
        e.preventDefault();
        dropZone.style.borderColor = '#cbd5e1';
        const file = e.dataTransfer.files[0];
        if (file && file.name.endsWith('.xlsx')) {
            const dt = new DataTransfer();
            dt.items.add(file);
            fileInput.files = dt.files;
            fileNameEl.textContent = '📄 ' + file.name;
            importBtn.disabled = false;
        } else {
            alert('Please drop a .xlsx file.');
        }
    });
</script>
</body>
</html>
