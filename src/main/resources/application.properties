spring.application.name=avb-importer
# Server
server.port=8080

# Database
spring.datasource.url=jdbc:mysql://localhost:3306/avb_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=avb_user
spring.datasource.password=avb_password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# File upload limits
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Thymeleaf
spring.thymeleaf.cache=false